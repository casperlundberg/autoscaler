name: ci

on:
  push:
    branches: [main]
    # A release tag builds an image named for the release. It does not deploy:
    # the commit it tags was already built and deployed from main.
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: make fmt-check
      - run: make vet
      - run: make test-race
      # The version stamped on every image comes from these, so they are
      # tested against real repositories and tags like the code is.
      - run: make scripts-test

  # Push to main only, and only behind check: a published tag is something a
  # cluster can pull, so nothing that has not passed the suite gets one. A
  # pull request builds no image at all — a tag pushed from a branch would be
  # indistinguishable from one that had been reviewed.
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      # Docker Hub authenticates from repository secrets, not from the
      # workflow token, so the token needs nothing beyond reading this
      # repository. packages: write would only matter for GHCR.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: the version is derived from the
          # nearest release tag and the commits since it.
          fetch-depth: 0

      # Which code this image is, stamped into it so a running service can say.
      # A release pushes its commit and tag together, so a build of that commit
      # already sees the tag and is stamped with the release, not a dev build.
      - id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      # DOCKER_A is an access token on the DOCKERHUB_USERNAME account. Of the
      # two tokens stored, it is the one that authenticates — DOCKER_B is
      # refused as an incorrect password — established by trying both in a
      # throwaway workflow rather than a build at a time. The name stays
      # opaque because GitHub will not read a secret back out, so renaming it
      # would mean minting a new token; the mapping is written down here
      # instead.
      #
      # Order matters more than the names do: a token sent where the username
      # goes is answered with "malformed HTTP Authorization header", which
      # names nothing that would lead anyone here.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_A }}

      # Two tags, and the immutable one is the point. main moves, so a
      # deployment that names only main names a manifest that never changes,
      # and ArgoCD reads an unchanged manifest as nothing to sync: the image
      # would be rebuilt and never rolled out. sha-<commit> is what a
      # deployment pins; main is for a human pulling the current one.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/cappelumpa/autoscaler
          # sha-<commit> and main from the branch; the release version from a
          # tag. A tag build must not push sha-<commit>: that tag already names
          # the image deployed from main, and a pinned tag that changes content
          # underneath a deployment is not pinned.
          tags: |
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=main,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            MODIFIED=false
          # Without a cache every push recompiles the module graph from
          # scratch, which is most of the build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Point the cluster at what was just built.
  #
  # Without this the pipeline stops at the registry: CI publishes
  # sha-<commit>, the Application in the infra repo goes on naming an older
  # one, and the new code never reaches the cluster. That gap is why the
  # deployment once sat broken for 45 hours with every check green.
  #
  # It deploys by committing to the GitOps repo rather than touching the
  # cluster, so the deploy is an ordinary reviewable commit and ArgoCD stays
  # the only thing that writes to Kubernetes.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes in quick succession would otherwise race each other into the
    # infra repo; the later one wins, which is the right answer, but only if
    # they go one at a time.
    concurrency:
      group: deploy-autoscaler-to-infra
      cancel-in-progress: false
    steps:
      # The secret does not exist until someone creates it, and a deploy job
      # that fails for a missing credential would turn every build red for a
      # reason that has nothing to do with the build. Skip, loudly, instead.
      - id: guard
        env:
          TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "INFRA_REPO_TOKEN is not set, so this build will not be deployed."
            echo "Add a token with write access to"
            echo "vikingvault-labs/vikingvault-infrastructure to this repository's"
            echo "secrets to close the loop from a green build to the cluster."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          repository: vikingvault-labs/vikingvault-infrastructure
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: move the pinned tag to this commit
        if: steps.guard.outputs.ok == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          file="devops/argocd-applications/autoscale-platform-autoscaler.yaml"
          [ -f "$file" ] || { echo "no such Application: $file"; exit 1; }

          # Exactly one pinned tag, or the edit is ambiguous and must not be
          # guessed at.
          n=$(grep -c '^ *tag: "sha-' "$file" || true)
          [ "$n" = "1" ] || { echo "expected 1 pinned tag in $file, found $n"; exit 1; }

          current=$(grep -oP '^ *tag: "\K[^"]+' "$file")
          if [ "$current" = "sha-$SHA" ]; then
            echo "already at sha-$SHA"; exit 0
          fi

          sed -i -E "s|^( *tag: )\"sha-[0-9a-f]{40}\"|\\1\"sha-${SHA}\"|" "$file"

          # The token this runs with can write to more than this file. The job
          # is what keeps the change small, so it refuses to commit anything
          # but the one tag line it exists to move.
          changed=$(git diff --name-only)
          [ "$changed" = "$file" ] || { echo "expected only $file to change, got: $changed"; exit 1; }
          [ "$(git diff --numstat -- "$file")" = "1	1	$file" ] || {
            echo "expected exactly one changed line:"; git diff -- "$file"; exit 1; }
          if git diff -U0 -- "$file" | grep -E '^[+-][^+-]' \
               | grep -qvE '^[+-] *tag: "sha-[0-9a-f]{40}"$'; then
            echo "diff touches something other than the tag:"; git diff -- "$file"; exit 1
          fi

          # Stage the one file by name. `git commit -a` would sweep in anything
          # else that happened to be dirty; naming it keeps the commit as
          # narrow as the checks above just proved the change to be.
          git add "$file"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Deploy autoscaler ${SHA:0:12}" \
            -m "Built and published by autoscaler CI from ${SHA}." \
            -m "Only the pinned image tag changed; the job refuses to commit anything else."

          # Another service's CI may have landed its own bump in between. Its
          # commit touches a different file, so a rebase is clean.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "deployed: $current -> sha-$SHA"; exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --quiet
            sleep $(( attempt * 3 ))
          done
          echo "could not push after 5 attempts"; exit 1
